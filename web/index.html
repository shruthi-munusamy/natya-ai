<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Natya — mudra recognition</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --muted: #999;
    --accent: #d4a574;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .stage {
    position: relative;
    width: min(640px, 100%);
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  video, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(-1); }
  canvas { transform: scaleX(-1); }
  .panel {
    width: min(640px, 100%);
    margin-top: 16px;
    background: #141414;
    border-radius: 12px;
    padding: 16px 20px;
    min-height: 80px;
  }
  .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .prediction {
    font-size: 28px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.01em;
  }
  .confidence {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 16px;
    text-align: center;
  }
  .interpretation {
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    min-height: 24px;
  }
  .interpretation .placeholder {
    color: var(--muted);
    font-style: italic;
  }
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 24px;
  }
  .loading-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.3;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
    40% { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>
  <h1>Natya</h1>
  <div class="subtitle">Real-time Bharatanatyam mudra recognition</div>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="panel">
    <div class="label">Detected mudra</div>
    <div class="prediction" id="prediction">—</div>
    <div class="confidence" id="confidence"></div>
  </div>
  <div class="panel">
    <div class="label">Viniyoga interpretation</div>
    <div class="interpretation" id="interpretation">
      <span class="placeholder">Hold a mudra steady to see its interpretation</span>
    </div>
  </div>
  <div class="status" id="status">Loading models…</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
